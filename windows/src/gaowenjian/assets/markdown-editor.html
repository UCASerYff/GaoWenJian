<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src {{ORIGIN}} 'unsafe-eval'; style-src {{ORIGIN}} 'unsafe-inline'; img-src {{ORIGIN}} data:; font-src {{ORIGIN}} data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Markdown 编辑器</title>
  <link rel="stylesheet" href="/md-assets/vendor/katex.min.css">
  <link rel="stylesheet" href="/md-assets/markdown.css">
  <link rel="stylesheet" href="/markdown-theme.css">
  <script defer src="/markdown-bridge.js"></script>
  <script defer src="/md-assets/vendor/marked.js"></script>
  <script defer src="/md-assets/vendor/purify.min.js"></script>
  <script defer src="/md-assets/vendor/katex.min.js"></script>
  <script defer src="/md-assets/vendor/highlight.min.js"></script>
  <script defer src="/md-assets/vendor/mermaid.min.js"></script>
  <script defer src="/md-assets/markdown-core.js"></script>
  <script defer src="/md-assets/markdown-editor.js"></script>
</head>
<body>
  <aside id="outline" aria-label="文档大纲"><div class="outline-title">文档大纲</div><nav id="outline-items" aria-label="标题"></nav></aside>
  <main id="workspace" class="mode-live">
    <section id="source-pane" aria-label="Markdown 源码">
      <div class="md-pane-heading" aria-hidden="true">源码</div>
      <textarea id="source" aria-label="Markdown 源码" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea>
    </section>
    <section id="preview-pane" aria-label="Markdown 预览和即时编辑">
      <div class="md-pane-heading" aria-hidden="true">预览</div>
      <article id="document" class="markdown-body"></article>
    </section>
  </main>
  <footer><span id="status">正在准备编辑器…</span><span id="mode-hint">点击段落编辑 · Esc 完成编辑</span></footer>
</body>
</html>
