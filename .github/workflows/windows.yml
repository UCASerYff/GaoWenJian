name: Windows

on:
  pull_request:
  push:
    branches:
      - main
      - codex/windows-icons-verify-20261128

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Locate or provision Inno Setup
        shell: pwsh
        run: |
          $tool = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) {
            $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $download
            $expected = 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C'
            if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ne $expected) { throw 'Inno Setup checksum mismatch' }
            $target = Join-Path $env:RUNNER_TEMP 'InnoSetup'
            $result = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/SP-','/NOICONS','/TASKS=','/PORTABLE=1',('/DIR="' + $target + '"')) -WindowStyle Hidden -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
            $tool = Join-Path $target 'ISCC.exe'
          }
          "GAO_INNO_COMPILER=$tool" >> $env:GITHUB_ENV
      - name: Build and exercise the installed package
        id: build
        shell: pwsh
        run: |
          $windowsDirectory = Join-Path $env:GITHUB_WORKSPACE 'windows'
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'Release'
          & (Join-Path $windowsDirectory 'build.ps1') -InnoCompiler $env:GAO_INNO_COMPILER -ReleaseDirectory $releaseDirectory
          $version = (Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'VERSION')).Trim()
          $windowsBuild = python -c "import runpy, sys; print(runpy.run_path(sys.argv[1])['WINDOWS_BUILD'])" (Join-Path $windowsDirectory 'src/gaowenjian/version.py')
          $installer = Join-Path $releaseDirectory "GaoWenJian-Windows-$version-build$windowsBuild-x64-Setup.exe"
          python (Join-Path $windowsDirectory 'tests/install_smoke.py') $installer
          "installer=$($installer.Replace('\', '/'))" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: GaoWenJian-Windows-x64
          if-no-files-found: error
          path: |
            ${{ steps.build.outputs.installer }}
            ${{ steps.build.outputs.installer }}.sha256
