name: macOS parity validation
on:
  push:
    branches: ['codex/macos-parity-verify-20261127-7af27c34a2']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run focused macOS checks
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          xcrun swiftc -version
          zsh Scripts/test-headless.sh --research-handoff-only
